name: motoclick_support
description: Botón de soporte que manda los reportes directo a Chatwoot. Sin backend, solo URL de Chatwoot + identificador del inbox.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=0.13.6 <2.0.0"
  shared_preferences: ">=2.0.0 <3.0.0"
  web_socket_channel: ">=2.4.0 <4.0.0"
  image_picker: ">=1.0.0 <2.0.0"
  google_fonts: ">=6.0.0 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=2.0.0 <7.0.0"
